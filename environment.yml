# Project env.
#   Any machine:    conda env create -f environment.yml && conda activate map-stdp
#   Campus cluster (stay off the /u file quota):
#     CONDA_PKGS_DIRS=/scratch/vikramr2/conda/pkgs conda env create -p /scratch/vikramr2/conda/envs/map-stdp -f environment.yml
#   Then, with the env active: npm install -g katex pyright @colbymchenry/codegraph@1.6.2 && codegraph telemetry off
#   (on the cluster add --cache /scratch/vikramr2/conda/npm-cache)
name: map-stdp
channels:
  - conda-forge
dependencies:
  - python=3.11
  - nodejs>=20
  - numpy
  - scipy
  - numba
  - gymnasium
  - matplotlib
  - networkx
  - ruff
  - pytest
  - pip
  - pip:
      - superneuromat==3.5.0
